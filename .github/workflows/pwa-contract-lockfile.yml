name: Regenerate PWA contract lockfile

on:
  push:
    branches:
      - fix/pwa-consumer-contract
    paths:
      - 'package.json'
      - '.github/workflows/pwa-contract-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pwa-consumer-contract
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: regenerate lockfile for PWA contract fix'
          git push origin HEAD:fix/pwa-consumer-contract
