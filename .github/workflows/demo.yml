name: Design System Demo

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/showcase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/showcase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NETLIFY_SITE_ID: 725a8c27-0813-4014-b3f0-ffd725d3847f
  TT_DESIGN_SYSTEM_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/tt-design-system-actions/providers/deploy
  TT_DESIGN_SYSTEM_SERVICE_ACCOUNT: tt-design-netlify-reader@wudong-agent-master.iam.gserviceaccount.com

concurrency:
  group: design-system-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate design system
        run: |
          pnpm test
          pnpm build
          pnpm smoke:consumer
          pnpm demo:typecheck
          pnpm demo:build
      - name: Validate demo artifact
        run: |
          set -euo pipefail
          test -f examples/showcase/dist/index.html
          if find examples/showcase/dist -type l -print -quit | grep -q .; then
            echo 'Demo artifact contains a symlink' >&2
            exit 1
          fi
      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-system-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/showcase/dist
          if-no-files-found: error
          retention-days: 7

  preview-deploy:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check preview deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "${NETLIFY_AUTH_TOKEN}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Netlify preview deployment is configured.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::PR preview deployment is optional and not configured. Production uses GCP Workload Identity Federation.'
          fi
      - name: Download demo artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: design-system-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/showcase/dist
      - name: Deploy PR preview to Netlify
        if: steps.config.outputs.configured == 'true'
        id: netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./examples/showcase/dist
          production-branch: main
          github-token: ${{ github.token }}
          deploy-message: "Design system preview — PR #${{ github.event.pull_request.number }} (${{ github.sha }})"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download demo artifact
        uses: actions/download-artifact@v4
        with:
          name: design-system-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/showcase/dist
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: wudong-agent-master
          workload_identity_provider: ${{ env.TT_DESIGN_SYSTEM_WIF_PROVIDER }}
          service_account: ${{ env.TT_DESIGN_SYSTEM_SERVICE_ACCOUNT }}
      - name: Load production Netlify credential
        id: gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            netlify_auth_token:wudong-agent-master/tt-players-netlify-auth-token
      - name: Deploy production demo to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./examples/showcase/dist
          production-branch: main
          github-token: ${{ github.token }}
          deploy-message: "Design system production deploy — ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.gcp-secrets.outputs.netlify_auth_token }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
        timeout-minutes: 5
      - name: Clean temporary Google credentials
        if: always()
        run: |
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
