name: TT Design System Package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.agents/skills/tt-design-system/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/package.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.agents/skills/tt-design-system/**'
      - 'package.json'
      - 'tsconfig*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/package.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current package version to GitHub Packages'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: tt-design-system-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@everything-tt'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run contract tests
        run: pnpm test
      - name: Build publishable package
        run: pnpm build
      - name: Inspect package contents
        run: npm pack ./dist --dry-run
      - name: Test packed package as a consumer
        run: pnpm smoke:consumer
      - name: Publish to GitHub Packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME=$(node -p "require('./dist/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./dist/package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists. Bump package.json before publishing another package change."
            exit 1
          fi
          npm publish ./dist --registry=https://npm.pkg.github.com
